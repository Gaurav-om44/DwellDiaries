<section id="sideboard-grid" class="py-5 bg-warm-beige">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="display-4 fw-bold text-dark mb-3">Sideboard</h2>
      <p class="lead text-muted">Elegant sideboards that combine style and functionality for your dining and living spaces</p>
    </div>
    
    <div class="row g-4">
      <!-- Sideboard 1 -->
      <div class="col-lg-4 col-md-6">
        <app-sideboard 
          [sideboard]="sideboards[0]"
          [index]="0">
        </app-sideboard>
      </div>
      
      <!-- Sideboard Text -->
      <div class="col-lg-4 col-md-6">
        <div class="design-card h-100 d-flex align-items-center justify-content-center text-center p-4" 
             style="background: linear-gradient(135deg, #f5f5f0 0%, #e8e8e0 100%); min-height: 300px; border-radius: 12px;">
          <div>
            <h3 class="fw-bold text-dark mb-0" style="font-size: 2rem; letter-spacing: 2px;">SIDEBOARD</h3>
          </div>
        </div>
      </div>
      
      <!-- Sideboard 2 -->
      <div class="col-lg-4 col-md-6">
        <app-sideboard 
          [sideboard]="sideboards[1]"
          [index]="1">
        </app-sideboard>
      </div>
    </div>
  </div>
</section>
