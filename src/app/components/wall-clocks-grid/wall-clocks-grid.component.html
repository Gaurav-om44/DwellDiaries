<section id="wall-clocks-grid" class="py-5 bg-light">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="display-4 fw-bold text-dark mb-3">Wall Clocks</h2>
      <p class="lead text-muted">Stylish wall clocks that combine functionality with artistic design for your home</p>
    </div>
    
    <div class="row g-4">
      <!-- Wall Clock 1 -->
      <div class="col-lg-4 col-md-6">
        <app-clock 
          [clock]="wallClocks[0]"
          [index]="0">
        </app-clock>
      </div>
      
      <!-- Wall Clocks Text -->
      <div class="col-lg-4 col-md-6">
        <div class="design-card h-100 d-flex align-items-center justify-content-center text-center p-4" 
             style="background: linear-gradient(135deg, #f5f5f0 0%, #e8e8e0 100%); min-height: 300px; border-radius: 12px;">
          <div>
            <h3 class="fw-bold text-dark mb-0" style="font-size: 2rem; letter-spacing: 2px;">WALL CLOCKS</h3>
          </div>
        </div>
      </div>
      
      <!-- Wall Clock 2 -->
      <div class="col-lg-4 col-md-6">
        <app-clock 
          [clock]="wallClocks[1]"
          [index]="1">
        </app-clock>
      </div>
    </div>
  </div>
</section>
